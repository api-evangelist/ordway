openapi: 3.0.3
info:
  title: Ordway REST Billing Runs Revenue Rules API
  description: RESTful API for bidirectional integration with the Ordway billing and revenue automation platform. Enables managing customers, subscriptions, invoices, payments, usage data, and revenue recognition schedules. Supports usage-based billing, ASC 606 compliant revenue recognition, accounts receivable automation, and SaaS metrics reporting.
  version: v1
  contact:
    name: Ordway Support
    url: https://support.ordwaylabs.com
  termsOfService: https://ordwaylabs.com/
servers:
- url: https://api.ordwaylabs.com/api/v1
  description: Production
- url: https://staging.ordwaylabs.com/api/v1
  description: Staging
security:
- ApiKeyAuth: []
  UserTokenAuth: []
  UserEmailAuth: []
  CompanyAuth: []
tags:
- name: Revenue Rules
  description: Manage revenue recognition rules
paths:
  /revenue_rules:
    get:
      summary: List revenue rules
      operationId: listRevenueRules
      tags:
      - Revenue Rules
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: List of revenue rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevenueRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /revenue_rules/{id}:
    get:
      summary: Retrieve a revenue rule
      operationId: getRevenueRule
      tags:
      - Revenue Rules
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Revenue rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueRule'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string
    size:
      name: size
      in: query
      description: Number of records per page
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
  schemas:
    RevenueRule:
      type: object
      required:
      - company_id
      - revenue_rule_id
      properties:
        company_id:
          type: string
        revenue_rule_id:
          type: string
        name:
          type: string
          nullable: true
        recognition_method:
          type: string
          nullable: true
        recognition_schedule_period:
          type: string
          nullable: true
        posting_day:
          type: string
          nullable: true
        posting_method:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        recognition_term:
          type: string
          nullable: true
        revenue_rule_entries:
          type: object
          nullable: true
          properties:
            period_offset:
              type: string
              nullable: true
            percent_to_recognize:
              type: string
              nullable: true
        created_by:
          type: string
          nullable: true
        updated_by:
          type: string
          nullable: true
        created_date:
          type: string
          format: date-time
          nullable: true
        updated_date:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties: true
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication credentials missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Ordway API key
    UserTokenAuth:
      type: apiKey
      in: header
      name: X-User-Token
      description: Ordway user authentication token
    UserEmailAuth:
      type: apiKey
      in: header
      name: X-User-Email
      description: Ordway user email address
    CompanyAuth:
      type: apiKey
      in: header
      name: X-User-Company
      description: Ordway company identifier
externalDocs:
  description: Ordway API Documentation
  url: https://ordwaylabs.stoplight.io/docs/ordway/ZG9jOjQ4OTgxNg-overview
